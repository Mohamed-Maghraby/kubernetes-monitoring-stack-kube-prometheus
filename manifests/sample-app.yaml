apiVersion: v1
kind: Namespace
metadata:
name: demo-app
--------------

apiVersion: apps/v1
kind: Deployment
metadata:
name: example-app
namespace: demo-app
labels:
app: example-app
spec:
replicas: 3
selector:
matchLabels:
app: example-app
template:
metadata:
labels:
app: example-app
spec:
containers:
- name: example-app
image: quay.io/brancz/prometheus-example-app:v0.5.0
imagePullPolicy: IfNotPresent
ports:
- name: web
containerPort: 8080
readinessProbe:
httpGet:
path: /
port: web
initialDelaySeconds: 5
periodSeconds: 10
livenessProbe:
httpGet:
path: /
port: web
initialDelaySeconds: 10
periodSeconds: 20
-----------------

apiVersion: v1
kind: Service
metadata:
name: example-app
namespace: demo-app
labels:
app: example-app
spec:
type: ClusterIP
selector:
app: example-app
ports:
- name: web
port: 8080
targetPort: web

